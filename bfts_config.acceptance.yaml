# Acceptance-run BFTS config: identical schema to bfts_config.yaml with only
# the load controls reduced so the bundled acceptance flow finishes quickly.
# All model values stay role/ names resolved through the role config.

# path to the task data directory
data_dir: "data"
preprocess_data: False

goal: null
eval: null

log_dir: logs
workspace_dir: workspaces

# whether to copy the data to the workspace directory (otherwise it will be symlinked)
# copying is recommended to prevent the agent from accidentally modifying the original data
copy_data: True

exp_name: run # a random experiment name will be generated if not provided

# settings for code execution
exec:
  timeout: 1200
  agent_file_name: runfile.py
  format_tb_ipython: False

generate_report: True

experiment:
  num_syn_datasets: 1

debug:
  stage4: False

# agent hyperparams
agent:
  type: parallel
  num_workers: 1
  stages:
    stage1_max_iters: 6
    stage2_max_iters: 2
    stage3_max_iters: 2
    stage4_max_iters: 4
  # how many improvement iterations to run
  steps: 1 # if stage-specific max_iters are not provided, the agent will use this value for all stages
  # whether to instruct the agent to use CV (set to 1 to disable)
  k_fold_validation: 1
  multi_seed_eval:
    num_seeds: 1 # should be the same as num_workers if num_workers < 3. Otherwise, set it to be 3.
  # whether to instruct the agent to generate a prediction function
  expose_prediction: False
  # whether to provide the agent with a preview of the data
  data_preview: False

  # LLM settings for coding
  code:
    model: role/experiment_code
    temp: 1.0
    # Not consumed by the treesearch caller (plan_and_code_query passes no
    # max_tokens; backend_openai falls back to the role budget). Kept at the
    # upstream default for config parity.
    max_tokens: 12000

  # LLM settings for evaluating program output / tracebacks
  feedback:
    model: role/experiment_feedback
    # gpt-4o
    temp: 0.5
    max_tokens: 8192

  vlm_feedback:
    model: role/visual_feedback
    temp: 0.5
    max_tokens: null

  search:
    max_debug_depth: 3
    debug_prob: 0.5
    num_drafts: 1

  # Options for summarizing findings and selecting the best node
  # If not specified, the default behavior will be used.

  summary:
    model: role/findings_synthesis
    temp: 0.3

  select_node:
    model: role/tree_scoring
    temp: 0.3
