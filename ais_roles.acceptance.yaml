# Acceptance-run role config for this workstation: identical to ais_roles.yaml
# except the spark endpoint goes through the WSL ssh relay (spark-relay hub
# process: 0.0.0.0:18888 -> spark2-ts:8888) because the Windows-native
# Tailscale socket path is currently broken. Untracked on purpose.
endpoints:
  local:
    base_url: http://localhost:8000/v1
    api_key_env: LOCAL_MODEL_API_KEY
    provides: [text, function_calling, vision]
    requires_user_message: true

  spark:
    base_url: http://localhost:18888/v1
    api_key_env: SPARK_MODEL_API_KEY
    provides: [text, vision, function_calling]
roles:
  ideation:               {endpoint: spark, model: deepseek-v4-flash-vision-exp, max_tokens: 8192}
  # qwen3.8 is a reasoning model. Treesearch callers pass max_tokens from the
  # bfts config (agent.code), which overrides the role budget below; the role
  # budget applies only when a caller passes none (backend_openai fallback).
  # Coding roles need headroom for reasoning + code in both paths.
  experiment_code:        {endpoint: local, model: qwen3.8-27b-6000pro, max_tokens: 32768, requires: [function_calling]}
  experiment_debugging:   {endpoint: local, model: qwen3.8-27b-6000pro, max_tokens: 32768, requires: [function_calling]}
  # plot_generation: aggregator-script generation hit the same reasoning wall
  # (32,616 reasoning chars, finish_reason='length') at 8192.
  plot_generation:        {endpoint: local, model: qwen3.8-27b-6000pro, max_tokens: 32768}
  tree_scoring:           {endpoint: local, model: qwen3.8-27b-6000pro, max_tokens: 4096, requires: [function_calling]}
  ideation_reflection:    {endpoint: spark, model: deepseek-v4-flash-vision-exp, max_tokens: 8192}
  experiment_planning:    {endpoint: spark, model: deepseek-v4-flash-vision-exp, max_tokens: 12000}
  experiment_feedback:    {endpoint: spark, model: deepseek-v4-flash-vision-exp, max_tokens: 8192}
  findings_synthesis:     {endpoint: spark, model: deepseek-v4-flash-vision-exp, max_tokens: 8192}
  # Spark's vision path returns empty content with finish_reason='length' at
  # any output budget (probe: out_tokens == budget, 0 content chars), while
  # local serves image_url parts correctly. Non-tool vision roles run local.
  visual_feedback:        {endpoint: local, model: qwen3.8-27b-6000pro, max_tokens: 8192, requires: [vision]}
  plot_interpretation:    {endpoint: spark, model: deepseek-v4-flash-vision-exp, max_tokens: 4096, requires: [vision]}
  review:                 {endpoint: spark, model: deepseek-v4-flash-vision-exp, max_tokens: 8192}
  report:                 {endpoint: spark, model: deepseek-v4-flash-vision-exp, max_tokens: 8192}
  writeup:                {endpoint: spark, model: deepseek-v4-flash-vision-exp, max_tokens: 32768, timeout: 1800}

  citation:               {endpoint: local, model: qwen3.8-27b-6000pro, max_tokens: 4096}
  writeup_small:          {endpoint: local, model: qwen3.8-27b-6000pro, max_tokens: 8192}
  figure_description:     {endpoint: local, model: qwen3.8-27b-6000pro, max_tokens: 4096, requires: [vision]}
  structured_extraction:  {endpoint: local, model: qwen3.8-27b-6000pro, max_tokens: 4096}

experiment_execution:
  cuda_device: 0
